
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Práctica API - EmailJS</title>

    <link rel="stylesheet" href="api.css">  
    <!-- Librería EmailJS -->
    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>

</head>
<body>

    <div class="contenedor">
        <img src="IMG/images (7).jpeg" alt="Logo" class="logo">
        <h1>Formulario de Contacto UNDC</h1>
        <p>Envíanos un mensaje</p>

        <form id="formulario">
            <label for="nombre">Nombre:</label>
            <input type="text" id="nombre" required>

            <label for="email">Correo electrónico:</label>
            <input type="email" id="email" required>

            <label for="destinatario">Correo del destinatario:</label>
            <input type="email" id="destinatario"
                 required>

            <label for="mensaje">Mensaje:</label>
            <textarea id="mensaje" rows="5" required></textarea>

            <button type="submit" id="enviar">
                Enviar mensaje
            </button>
        </form>

        <p id="resultado"></p>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/emailjs-com@3/dist/email.min.js"></script>
<script src="api.js" defer></script>

</body>
</html>
